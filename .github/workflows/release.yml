name: Release

# Publishes a GitHub Release with a zipped Oriel.app when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # The package targets macOS 26, so the build needs an Xcode that ships the
    # macOS 26 SDK — only the macos-26 image has it.
    runs-on: macos-26

    # The secrets context isn't allowed in step-level `if:`, so expose
    # presence flags here instead.
    env:
      HAVE_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: ./Scripts/test.sh

      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Scripts/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Scripts/Info.plist

      # Signing/notarization activates automatically once the secrets exist
      # (see README). Without them the build stays ad-hoc signed, as before.
      - name: Import Developer ID certificate
        if: env.HAVE_CERT == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          echo "CODESIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: ./Scripts/bundle.sh

      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Oriel.app Oriel.zip

      - name: Notarize and staple
        if: env.HAVE_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit Oriel.zip \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple build/Oriel.app
          spctl -a -t exec -vv build/Oriel.app
          # Re-zip so the release asset contains the stapled ticket.
          ditto -c -k --sequesterRsrc --keepParent build/Oriel.app Oriel.zip

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -n "${CODESIGN_IDENTITY:-}" ]]; then
            NOTES=""
          else
            NOTES="$(cat <<'EOF'
          > [!IMPORTANT]
          > This build is ad-hoc signed (no Developer ID / notarization), so
          > Gatekeeper will block the first launch. After unzipping, either
          > right-click → Open, or run:
          > `xattr -d com.apple.quarantine Oriel.app`
          EOF
          )"
          fi
          gh release create "$GITHUB_REF_NAME" "Oriel.zip#Oriel.app ($VERSION)" \
            --title "Oriel $VERSION" \
            --generate-notes \
            --notes "$NOTES"

      # For manual (workflow_dispatch) runs, keep the app as a build artifact
      # instead of publishing a release.
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Oriel.app
          path: Oriel.zip
